<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My events · Eventify</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header"></header>

  <main id="main" class="container py-4 py-lg-5">
    <h1 class="mb-4">My events</h1>
    <section class="mb-5" aria-labelledby="tickets-title">
      <div class="section-title"><h2 id="tickets-title">Tickets</h2></div>
      <div id="tickets"></div>
    </section>
    <section class="mb-5" aria-labelledby="waitlist-title">
      <div class="section-title"><h2 id="waitlist-title">Waitlist</h2></div>
      <div id="waitlist"></div>
    </section>
    <section aria-labelledby="past-title">
      <div class="section-title"><h2 id="past-title">Past events</h2></div>
      <div id="past"></div>
    </section>
  </main>

  <div class="modal fade" id="ticket-modal" tabindex="-1" aria-labelledby="ticket-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="ticket-title">Your ticket</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center" id="ticket-body"></div>
      </div>
    </div>
  </div>

  <footer id="site-footer"></footer>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/my-events.js"></script>
</body>
</html>
